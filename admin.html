<!DOCTYPE html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel admina</title><link rel="stylesheet" href="style.css"><meta name="robots" content="noindex"></head><body>
<nav><div class="wrap"><b>🔐 Panel admina</b><a href="index.html">← Strona</a></div></nav><div class="wrap" style="padding:40px 20px">
<div class="card" id="login"><h3>Zaloguj się</h3><form onsubmit="login(event)"><input type="email" id="em" placeholder="E-mail admina" required><input type="password" id="pw" placeholder="Hasło" required><button class="btn s">Zaloguj</button></form><p id="err" style="color:#dc2626"></p></div>
<div id="panel" style="display:none"><div class="grid"><div class="card"><h3>Wszystkie zapisy</h3><div class="price" id="n">0</div></div><div class="card"><h3>Rodzice</h3><div class="price" id="nr">0</div></div><div class="card"><h3>Nauczyciele</h3><div class="price" id="nn">0</div></div></div><br>
<div class="card"><table><thead><tr><th>Data</th><th>E-mail</th><th>Kto</th></tr></thead><tbody id="rows"></tbody></table></div></div></div>
<script src="config.js"></script><script>
if(!CFG.SUPABASE_URL)document.getElementById('err').textContent='Baza danych nie jest jeszcze podłączona.';
async function login(e){e.preventDefault();const r=await fetch(CFG.SUPABASE_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:CFG.SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:em.value,password:pw.value})});
const j=await r.json();if(!j.access_token){err.textContent='Błędny e-mail lub hasło.';return}
const d=await(await fetch(CFG.SUPABASE_URL+'/rest/v1/zapisy?select=*&order=created_at.desc',{headers:{apikey:CFG.SUPABASE_KEY,Authorization:'Bearer '+j.access_token}})).json();
document.getElementById('login').style.display='none';panel.style.display='block';n.textContent=d.length;nr.textContent=d.filter(x=>x.kto.includes('rodzic')).length;nn.textContent=d.filter(x=>x.kto.includes('nauczyciel')).length;
rows.innerHTML=d.map(x=>`<tr><td>${new Date(x.created_at).toLocaleString('pl-PL')}</td><td>${x.email.replace(/</g,'&lt;')}</td><td>${x.kto}</td></tr>`).join('')}
</script></body></html>
